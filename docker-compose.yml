# Local infrastructure for agent-web-ui.
#
#   docker compose up -d --wait                      PostgreSQL and the scripted test agent
#   docker compose --profile full up -d --wait       those two and the web server
#   docker compose --profile selftest up -d --wait   the web server with a test agent that
#                                                    plays the evaluator's self-test script
#                                                    (then: scripts/eval.sh selftest)
#
# The full and selftest profiles each publish the web server on the same port, so
# use one at a time. Settings come from .env; create it with scripts/init-env.sh.
# Everything listens on 127.0.0.1 only.
name: inside-agent-web-ui

# What the two test agents and the two web servers have in common.
x-agent: &agent
  build:
    context: .
    dockerfile: Dockerfile.testagent
  image: agent-web-ui-testagent
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/test-agent", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 12

x-web: &web
  build:
    context: .
    dockerfile: Dockerfile
  image: agent-web-ui
  restart: unless-stopped
  ports:
    - "127.0.0.1:${WEB_PORT:-8300}:8300"
  healthcheck:
    test: ["CMD", "/agent-web-ui", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 12

x-web-environment: &web-environment
  APP_ENV: ${APP_ENV:-development}
  APP_HTTP_ADDR: ":8300"
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8300}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
  APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
  APP_SHUTDOWN_GRACE: ${APP_SHUTDOWN_GRACE:-10s}
  HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-131072}
  HTTP_BODY_TIMEOUT: ${HTTP_BODY_TIMEOUT:-30s}
  HTTP_RESPONSE_TIMEOUT: ${HTTP_RESPONSE_TIMEOUT:-2m}
  DB_URL: postgres://${POSTGRES_USER:-agentwebui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentwebui}?sslmode=disable
  DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
  DB_MIGRATE_ON_START: "true"
  AGENT_APP_NAME: ${AGENT_APP_NAME:-ui_agent}
  AGENT_REQUEST_TIMEOUT: ${AGENT_REQUEST_TIMEOUT:-120s}
  CHAT_MAX_MESSAGE_CHARS: ${CHAT_MAX_MESSAGE_CHARS:-8000}
  CHAT_STREAM_FLUSH_INTERVAL: ${CHAT_STREAM_FLUSH_INTERVAL:-50ms}
  CHAT_LIST_LIMIT: ${CHAT_LIST_LIMIT:-100}
  RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-2}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
  SESSION_TTL: ${SESSION_TTL:-24h}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentwebui}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?there is no .env yet, run scripts/init-env.sh}"
      POSTGRES_DB: ${POSTGRES_DB:-agentwebui}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  agent:
    <<: *agent
    environment:
      # How fast the scripted replies stream; raise the chunks for a long #slow reply.
      TEST_AGENT_WORD_DELAY: ${TEST_AGENT_WORD_DELAY:-10ms}
      TEST_AGENT_SLOW_DELAY: ${TEST_AGENT_SLOW_DELAY:-100ms}
      TEST_AGENT_SLOW_CHUNKS: ${TEST_AGENT_SLOW_CHUNKS:-50}
    ports:
      - "127.0.0.1:${AGENT_PORT:-9093}:9093"

  web:
    <<: *web
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      <<: *web-environment
      AGENT_BASE_URL: http://agent:9093/api

  # The same test agent, answering the evaluator's invented problems from a
  # script (see internal/eval/infrastructure/synthetic). It has no published
  # port: only the web server below talks to it.
  agent-selftest:
    <<: *agent
    profiles: ["selftest"]
    environment:
      TEST_AGENT_WORD_DELAY: 5ms
      TEST_AGENT_FIXTURE: /fixtures/synthetic_replies.json
    volumes:
      - ./internal/eval/infrastructure/synthetic/data:/fixtures:ro

  web-selftest:
    <<: *web
    profiles: ["selftest"]
    depends_on:
      postgres:
        condition: service_healthy
      agent-selftest:
        condition: service_healthy
    environment:
      <<: *web-environment
      AGENT_BASE_URL: http://agent-selftest:9093/api

volumes:
  pgdata:
