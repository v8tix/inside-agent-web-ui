{{define "page:title"}}Sign in{{end}}

{{define "page:main"}}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <h1 class="h3 mb-4">Sign in</h1>

    {{if .Error}}
    <div class="alert alert-danger" role="alert" data-testid="error">{{.Error}}</div>
    {{end}}

    <form method="post" action="/login" novalidate>
      <input type="hidden" name="next" value="{{.Next}}">
      <div class="mb-3">
        <label for="login-email" class="form-label">Email</label>
        <input type="email" class="form-control" id="login-email" name="email" value="{{.Email}}"
               autocomplete="username" autofocus required data-testid="login-email">
      </div>
      <div class="mb-3">
        <label for="login-password" class="form-label">Password</label>
        <input type="password" class="form-control" id="login-password" name="password"
               autocomplete="current-password" required data-testid="login-password">
      </div>
      <button type="submit" class="btn btn-primary w-100" data-testid="login-submit">Sign in</button>
    </form>
  </div>
</div>
{{end}}
